# Pre-registered settings for Part 1. Fixed before generation begins; any change
# after images exist invalidates them and must be recorded in the report.

generation:
  width: 864              # InfUFluxPipeline defaults, i.e. the paper's setting
  height: 1152
  num_steps: 30
  guidance_scale: 3.5
  infusenet_conditioning_scale: 1.0
  infusenet_guidance_start: 0.0
  infusenet_guidance_end: 1.0

memory_profile:
  # MEASURED 22 Aug 2026, A100 40GB, 20 images each, 864x1152 / 30 steps,
  # real manifest and curated reference portraits (jobs 1789377 / 1789378).
  chosen: quantize_8bit
  measured_sec_per_image: 25.0

  comparison:
    quantize_8bit: {median_s: 25.0, mean_s: 25.0, min_s: 24.5, max_s: 25.7, load_s: 92}
    cpu_offload:   {median_s: 37.0, mean_s: 40.3, min_s: 35.9, max_s: 87.7, load_s: 25}
  notes: >
    8-bit is 1.48x faster per image and far more consistent (+/-0.6 s across 20
    images versus a 52 s spread for offload, whose 87.7 s maximum is first-image
    CUDA warmup -- which is why the median is the honest statistic here). The
    67 s extra load cost amortises to under 2% over a 188-image shard. This
    profile is now fixed for EVERY generation in the project: mixing 8-bit and
    bf16 across runs would confound the results with a quantisation effect.
    Worth reporting -- the paper gives no deployment cost figures at all.

methods:
  infu_aes2:  {model_version: aes_stage2}
  pulid:      {id_weight: 1.0, id_start: 4, fp8: false, offload: true}
  # infu_sim1 and flux_ipa are optional; see the guide's cut order.

seeds:
  rule: "sha256(f'{iid}|{base_pid}')[:8] % 2**31"
  note: "Never modify src/manifest.py:derive_seed once generation has started."

budget:
  # at the measured 25.0 s/img
  part1_per_method_gpu_h: 10.4       # 1500 cells
  part1_both_methods_gpu_h: 20.8
  part2_per_method_gpu_h: 4.0        # 576 cells
  part2_both_methods_gpu_h: 8.0

cluster:
  # measured on tinyx, 20 Aug 2026 - do not re-guess these
  partition: a100                 # 8 x tg09[0-7], 4 x A100 40GB each = 32 GPUs
  walltime_limit: "24:00:00"
  module: python/3.12-conda       # NOT 3.11-anaconda; that module does not exist
  cuda_available: [11.8.0, 12.4.1, 12.6.2, 12.8.0]
  qos: normal                     # MaxTRES gres/gpu=50 per user, no job-count cap
  quota_home_gb: 100              # /home/hpc/rlvl/rlvl159v
  quota_work_gb: 1000             # /home/woody/rlvl/rlvl159v  ($WORK)
  observed_queue_wait: "highly variable: 3.5 h (Thu evening) vs 18 min (Fri morning)"
  hpcvault: not_provisioned      # /home/vault/rlvl/rlvl159v does not exist
  home_filesystem_full: "92% used cluster-wide - keep everything on $WORK"
  stale_guidance: >
    The IDEA Lab HPC-Introduction deck (April 2024) says to load
    python/3.8-anaconda; that module does not exist on TinyGPU. It also quotes
    50/500/200 GB quotas; measured values are 100 GB $HOME and ~1 TB $WORK.
    Measured values win.
